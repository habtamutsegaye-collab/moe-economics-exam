<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <title>MoE - Exam Portal</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .login-card {
            background: #ffffff;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .logo {
            width: 90px;
            height: 90px;
            margin-bottom: 15px;
        }
        h2 {
            color: #1b4d8e;
            margin-bottom: 25px;
            font-size: 22px;
        }
        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 14px;
        }
        .btn-login {
            background-color: #1b4d8e;
            color: white;
            border: none;
            padding: 12px 20px;
            width: 100%;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
        }
        .btn-login:hover {
            background-color: #143868;
        }
        .footer-text {
            margin-top: 25px;
            font-size: 13px;
            color: #666;
            border-top: 1px solid #eaeaea;
            padding-top: 15px;
        }
        .footer-text a {
            color: #1b4d8e;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="login-card">
    <!-- የትምህርት ሚኒስቴር አርማ ምሳሌ -->
    <div style="font-size: 50px; margin-bottom: 10px;">🏛️</div>
    <h2>MoE - Exam Portal</h2>
    
    <form>
        <div class="form-group">
            <input type="text" placeholder="Username" required>
        </div>
        <div class="form-group">
            <input type="password" placeholder="Password" required>
        </div>
        <button type="submit" class="btn-login">Log in</button>
    </form>

    <div class="footer-text">
        You are using :<br>
        <a href="https://exam1.ethernet.edu.et" target="_blank">exam1.ethernet.edu.et</a>[cite: 1]
    </div>
</div>

</body>
</html>
